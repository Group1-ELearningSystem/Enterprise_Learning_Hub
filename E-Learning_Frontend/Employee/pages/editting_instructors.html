<div class="add-instructor-container">

    <h3>Updating An Instructor</h3>

    <form id="addInstructorForm">
        <div class="form-section">
            <h4>Instructor Information</h4>

            <div class="form-grid">
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" id="insName" required readonly>
                </div>

                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="insEmail" required readonly>
                </div>

                <div class="form-group">
                    <label>Phone</label>
                    <input type="text" id="insPhone" required readonly>
                </div>
            </div>
        </div>

        <div class="form-grid">
            <div class="form-group">
                <label>Username</label>
                <input type="text" id="accUsername" readonly>
            </div>

            <div class="form-group">
                <label>Password</label>
                <input type="text" id="accPassword" readonly>
            </div>

            <div class="form-group">
                <label class="form-label">Account Status</label>
                <select id="accountStatus" class="form-control" required>
                    <option value="Active">Available</option>
                    <option value="Not Verified">Unavailable</option>
                </select>
            </div>
        </div>

        <button type="submit" class="submit-btn">Update Instructor</button>

    </form>
</div>

<div class="course-section">
    <h4>Instructor Courses</h4>
    <div id="instructorCoursesContainer" class="course-grid"></div>
</div>

<div id="feedbackModal" class="modal-overlay">
    <div class="modal-content">
        <div class="modal-header">
            <h4>Course Feedbacks</h4>
            <button id="closeFeedbackModal"
                    class="close-btn">
                ✕
            </button>
        </div>
        <div id="feedbackList" class="feedback-list"></div>
        <div id="avgRating"></div>
        <div id="pagination"></div>
    </div>
</div>
