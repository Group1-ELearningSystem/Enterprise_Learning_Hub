<div class="course-form-wrapper">
    <div class="form-card">
        <h3 class="form-title">Edit Course</h3>

        <form id="addCourseForm">
            <div class="form-group">
                <label class="form-label">Course Title</label>
                <input type="text" id="courseTitle" class="form-control" placeholder="Example: Python Fundamentals"
                    required>
            </div>

            <div class="form-group">
                <label class="form-label">
                    Instructor
                </label>
                <input type="text" id="courseInstructor" class="form-control" readonly>
            </div>

            <div class="form-group">
                <label class="form-label">Course Overview</label>
                <textarea id="courseOverview" class="form-control" rows="4" placeholder="Write a short description..."
                    required></textarea>
            </div>

            <div class="form-group">
                <label class="form-label">Course Objective</label>
                <textarea id="courseObjective" class="form-control" rows="4" placeholder="Write a short description..."
                    required></textarea>
            </div>

            <div class="form-group">
                <label class="form-label">Course Price (RM)</label>
                <input type="number" id="coursePrice" class="form-control" placeholder="Example: 49.99" step="0.01"
                    required>
            </div>

            <div class="form-group">
                <label class="form-label">
                    Course Field
                </label>
                <select id="empFieldSelect" class="form-control" required></select>
            </div>

            <div class="form-group">
                <label class="form-label">Course Status</label>
                <select id="courseStatus" class="form-control" required>
                    <option value="AVAILABLE">Available</option>
                    <option value="Draft">Unavailable</option>
                </select>
            </div>

            <button type="submit" class="save-btn">
                <i class="bi bi-check-square"></i>
                Save Course
            </button>
        </form>
    </div>

    <div class="form-card">
        <h4>Course Reviews</h4>
        <div id="avgRating"></div>
        <div id="feedbackList"></div>
        <div id="pagination" class="pagination"></div>
    </div>
</div>
