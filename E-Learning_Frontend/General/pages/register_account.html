<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register Page</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background:
                radial-gradient(circle at top left, rgba(30, 123, 230, 0.18), transparent 28%),
                radial-gradient(circle at bottom right, rgba(111, 66, 193, 0.16), transparent 28%),
                linear-gradient(135deg, #eef4ff, #f8fbff, #f5f7fb);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .register-wrapper {
            width: 100%;
            max-width: 460px;
        }

        .register-card {
            border: none;
            border-radius: 24px;
            padding: 36px 32px;
            background: rgba(255, 255, 255, 0.94);
            backdrop-filter: blur(8px);
            box-shadow: 0 18px 50px rgba(15, 23, 42, 0.12);
        }

        .brand-badge {
            display: inline-block;
            padding: 8px 14px;
            border-radius: 999px;
            background: #e8f1ff;
            color: #1e5bbf;
            font-size: 13px;
            font-weight: 700;
            margin-bottom: 16px;
        }

        .register-title {
            font-size: 32px;
            font-weight: 700;
            color: #0f172a;
            margin-bottom: 8px;
        }

        .register-subtitle {
            color: #64748b;
            font-size: 15px;
            margin-bottom: 28px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-label {
            font-weight: 600;
            color: #334155;
            margin-bottom: 8px;
        }

        .form-control {
            height: 52px;
            border-radius: 14px;
            border: 1px solid #dbe4f0;
            background: #f8fbff;
            padding: 0 16px;
            font-size: 15px;
            transition: all 0.2s ease;
            box-shadow: none;
        }

        .form-control:focus {
            border-color: #1e7be6;
            background: #ffffff;
            box-shadow: 0 0 0 4px rgba(30, 123, 230, 0.12);
        }

        .register-btn {
            width: 100%;
            height: 52px;
            border: none;
            border-radius: 14px;
            background: linear-gradient(135deg, #1e7be6, #1669c1);
            font-size: 16px;
            font-weight: 700;
            transition: all 0.25s ease;
        }

        .register-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 12px 24px rgba(30, 123, 230, 0.22);
            background: linear-gradient(135deg, #1669c1, #1258a2);
        }

        .message-box {
            display: none;
            border-radius: 14px;
            padding: 12px 14px;
            font-size: 14px;
            font-weight: 500;
            text-align: center;
            margin-bottom: 16px;
        }

        .message-box.error {
            background: #fef2f2;
            color: #b91c1c;
            border: 1px solid #fecaca;
        }

        .message-box.success {
            background: #ecfdf3;
            color: #15803d;
            border: 1px solid #bbf7d0;
        }

        .bottom-text {
            margin-top: 22px;
            text-align: center;
            color: #64748b;
            font-size: 14px;
        }

        .bottom-text a {
            color: #1e7be6;
            font-weight: 600;
            text-decoration: none;
        }

        .bottom-text a:hover {
            text-decoration: underline;
        }

        @media (max-width: 576px) {
            .register-card {
                padding: 28px 20px;
                border-radius: 20px;
            }

            .register-title {
                font-size: 28px;
            }

            .register-subtitle {
                font-size: 14px;
            }
        }
    </style>
</head>

<body>
    <div class="register-wrapper">
        <div class="card register-card">
            <div class="text-center">
                <span class="brand-badge">E-Learning</span>
                <h3 class="register-title">Create Account</h3>
                <p class="register-subtitle">
                    Register a free account to start your learning journey
                </p>
            </div>

            <form id="registerForm">
                <div class="form-group">
                    <label class="form-label">Full Name</label>
                    <input type="text" class="form-control" id="nameInput" placeholder="Enter your full name" required>
                </div>

                <div class="form-group">
                    <label class="form-label">Email Address</label>
                    <input type="email" class="form-control" id="emailInput" placeholder="Enter your email" required>
                </div>

                <div class="form-group">
                    <label class="form-label">Password</label>
                    <input type="password" class="form-control" id="passwordInput" placeholder="Create a password" required>
                </div>

                <div class="form-group">
                    <label class="form-label">Retype Password</label>
                    <input type="password" class="form-control" id="retypePasswordInput" placeholder="Retype your password" required>
                </div>

                <p id="registerError" class="message-box error"></p>
                <p id="registerSuccess" class="message-box success"></p>

                <button type="submit" class="btn btn-primary register-btn">
                    Create Account
                </button>

                <p class="bottom-text">
                    Already have an account?
                    <a href="login.html">Login here</a>
                </p>
            </form>
        </div>
    </div>
</body>

<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
<script>
    const registerForm = document.getElementById("registerForm")
    const nameInput = document.getElementById("nameInput")
    const emailInput = document.getElementById("emailInput")
    const passwordInput = document.getElementById("passwordInput")
    const retypePasswordInput = document.getElementById("retypePasswordInput")

    const registerError = document.getElementById("registerError");
    const registerSuccess = document.getElementById("registerSuccess");

    function showError(msg) {
        registerSuccess.style.display = "none";
        registerError.style.display = "block";
        registerError.textContent = msg;
    }

    function showSuccess(msg) {
        registerError.style.display = "none";
        registerSuccess.style.display = "block";
        registerSuccess.textContent = msg;
    }

    registerForm.addEventListener("submit", async (e) => {
        e.preventDefault()

        const nameValue = nameInput.value.trim()
        const emailValue = emailInput.value.trim()
        const passwordValue = passwordInput.value.trim()
        const retypePasswordValue = retypePasswordInput.value.trim()

        if (!nameValue || !emailValue || !passwordValue || !retypePasswordValue) {
            showError("Please fill in all fields.");
            return;
        }

        if (passwordValue.length < 6) {
            showError("Password must be at least 6 characters.");
            return;
        }

        if (passwordValue !== retypePasswordValue) {
            showError("Passwords do not match.");
            return;
        }

        try {
            const response = await axios.post(
                "http://localhost:5000/api/register",
                {
                    name: nameValue,
                    email: emailValue,
                    password: passwordValue
                }
            )
            showSuccess("To complete your registration, please enter the six-digit code sent to your email.");
            localStorage.setItem("verifyEmail", emailValue)
            setTimeout(() => {
                window.location.href = "email_verification.html"
            }, 1500)

        } catch (err) {
            if (err.response) {
                showError(err.response.data.message)
            } else {
                showError("Cannot connect to server")
            }
        }
    })
</script>

</html>
